# Builds the ready-to-run player package and publishes it as a GitHub release.
#
# Publish: Actions -> "Release" -> Run workflow (on master). The version comes
# from the commit history (feat: = minor, fix: = patch), so nothing to type.
# Pull requests that touch packaging only build the zip, without publishing.
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release (off = build only)"
        type: boolean
        default: true
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/build-release.ps1"
      - "tools/release_package.py"
      - "github_release.py"
      - "launcher/**"
      - "requirements.txt"
      - "dashboard/package*.json"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version is derived from the whole history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@v6

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc

      - name: Tests
        shell: pwsh
        run: |
          python -m pip install -q -r requirements-dev.txt
          python -m pytest -q
          node --test tests/desktop_launcher.test.cjs

      - name: Build package
        id: package
        shell: pwsh
        run: |
          .\scripts\build-release.ps1 -Repo "${{ github.repository }}" -MinGwBin "${{ steps.msys2.outputs.msys2-location }}\mingw32\bin"

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            build/release/*.zip
            build/release/release.json
            build/release/release-notes.md
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists. Merge a new commit first."
            exit 1
          fi
          gh release create "$VERSION" "DBVictory-Bot-$VERSION.zip" release.json \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DBVictory Bot $VERSION" --notes-file release-notes.md
