# Builds the ready-to-run player package and publishes it as a GitHub release.
#
# Publish: Actions -> "Release" -> Run workflow (on master). The version comes
# from the commit history (feat: = minor, fix: = patch), so nothing to type.
# Pull requests that touch packaging only build the zip, without publishing.
#
# Test build: Run workflow on any other branch (for example a pull request's). It is
# published as a pre-release vX.Y.Z-test.<commit>, which GitHub never marks "latest":
# players' launchers ignore it, master's version numbers are unaffected, and only a
# launcher with "Wersje testowe" switched on offers it. A new test build of a branch
# replaces that branch's previous one; "Delete test builds" removes them.
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release (off = build only)"
        type: boolean
        default: true
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/build-release.ps1"
      - "tools/release_package.py"
      - "tools/release_trim.py"
      - "tools/release_previous.py"
      - "tools/brand_exe.py"
      - "dbv/mcp_server/panel_server.py"
      - "dbv/mcp_server/panel_window.py"
      - "dbv/mcp_server/panel_alerts.py"
      - "dashboard/public/desktop-bridge.js"
      - "github_release.py"
      - "launcher/**"
      - "requirements.txt"
      - "dashboard/package*.json"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      # Anything not built from master is a test build (pull request checks included).
      TEST_BUILD: ${{ github.ref != 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version is derived from the whole history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@v6

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc

      - name: Tests
        shell: pwsh
        run: |
          python -m pip install -q -r requirements-dev.txt
          python -m pytest -q
          node --test tests/desktop_launcher.test.cjs

      - name: Build package
        id: package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}   # reads the latest release to build the patch against it
        run: |
          $build = @{ Repo = "${{ github.repository }}"; MinGwBin = "${{ steps.msys2.outputs.msys2-location }}\mingw32\bin" }
          if ($env:TEST_BUILD -eq "true") { $build.TestBuild = $true }
          .\scripts\build-release.ps1 @build

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            build/release/*.zip
            build/release/release.json
            build/release/release-manifest.json
            build/release/release-notes.md
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Create GitHub release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists. Merge a new commit first."
            exit 1
          fi
          shopt -s nullglob
          # The patch (only files changed since the previous release) exists when there was one.
          assets=("DBVictory-Bot-$VERSION.zip" DBVictory-Bot-"$VERSION"-patch-v*.zip release.json release-manifest.json)
          gh release create "$VERSION" "${assets[@]}" \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DBVictory Bot $VERSION" --notes-file release-notes.md

      - name: Create test pre-release
        if: github.ref != 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-test\.[0-9a-f]{7}$ ]]; then
            echo "::error::$VERSION is not a test build version."
            exit 1
          fi
          title_suffix="($BRANCH)"
          # One test build per branch: drop this branch's earlier ones (and a rerun of this commit).
          gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName,name,isPrerelease \
            --jq '.[] | select(.isPrerelease) | [.tagName, .name] | @tsv' |
          while IFS=$'\t' read -r tag name; do
            if [[ "$tag" =~ -test\.[0-9a-f]{7}$ && ( "$name" == *" $title_suffix" || "$tag" == "$VERSION" ) ]]; then
              echo "Removing earlier test build $tag"
              gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
          done
          shopt -s nullglob
          assets=("DBVictory-Bot-$VERSION.zip" DBVictory-Bot-"$VERSION"-patch-v*.zip release.json release-manifest.json)
          {
            echo "## Test build $VERSION"
            echo
            echo "Branch \`$BRANCH\`, commit $GITHUB_SHA. Not for players: only launchers with"
            echo "**Ustawienia → Wersje testowe** switched on offer it. Delete it when done testing."
          } > test-notes.md
          gh release create "$VERSION" "${assets[@]}" \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Test build $VERSION $title_suffix" --notes-file test-notes.md
